name: Build and Publish Docker Image

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: truenas-tesla-automatic-preconditioning-storage-32g
    env:
      BUILDKIT_HOST: tcp://buildkit:1234
      BUILDKIT_TLS_CA_CERT: /run/buildkit/tls/ca.pem
      BUILDKIT_TLS_CLIENT_CERT: /run/buildkit/tls/client.pem
      BUILDKIT_TLS_CLIENT_KEY: /run/buildkit/tls/client.key
    steps:
      - name: Prepare disk dependency cache
        id: ci_disk_cache_downloads
        run: ci-cache downloads
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build with Maven
        run: ./mvnw -B package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Set up remote Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          driver: remote
          endpoint: tcp://buildkit:1234
          driver-opts: |
            cacert=/run/buildkit/tls/ca.pem
            cert=/run/buildkit/tls/client.pem
            key=/run/buildkit/tls/client.key
      - name: Prepare disk build cache
        id: ci_disk_cache_1
        run: ci-cache "truenas-12900585dbca70e2"
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          cache-from: |
            type=local,src=${{ steps.ci_disk_cache_1.outputs.from }}
            type=gha,version=2,scope=truenas-12900585dbca70e2
          cache-to: ${{ steps.ci_disk_cache_1.outputs.to && format('type=local,dest={0},mode=max,ignore-error=true', steps.ci_disk_cache_1.outputs.to) || '' }}
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
